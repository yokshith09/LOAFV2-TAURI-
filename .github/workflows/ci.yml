name: CI

# This workflow is the answer to "do I get a Mac build and a Windows build?".
# Tauri compiles for the HOST os, so one machine cannot produce both. The matrix
# below runs the same build on a macOS runner and a Windows runner, and the
# `bundle` job uploads the installer each one produces.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  rust:
    name: Rust — fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri needs the frontend bundle present before the Rust crate compiles,
      # because tauri.conf.json points frontendDist at ../dist.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --all

  bundle:
    name: Bundle (${{ matrix.os }})
    # Deliberately does NOT depend on the `rust` job. That job runs
    # `clippy -D warnings`, and a single pedantic lint would otherwise block the
    # installers — including the macOS build that testers are waiting on. This
    # job compiles the Rust itself, so genuine compile errors still surface here;
    # only style findings are decoupled.
    needs: [frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # NOTE: unsigned. Signing and notarisation are Phase 4 — see the
      # direction document. Until then macOS users need right-click -> Open and
      # Windows shows a SmartScreen warning.
      - name: Build application
        run: npm run tauri:build

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: loaf-${{ matrix.label }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
