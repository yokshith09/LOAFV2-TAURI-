name: CI

# This workflow is the answer to "do I get a Mac build and a Windows build?".
# Tauri compiles for the HOST os, so one machine cannot produce both. The matrix
# below runs the same build on a macOS runner and a Windows runner, and the
# `bundle` job uploads the installer each one produces.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  rust:
    name: Rust — fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri needs the frontend bundle present before the Rust crate compiles,
      # because tauri.conf.json points frontendDist at ../dist.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      # Blocking again. It was advisory because Smart App Control on the
      # development machine stopped cargo running locally, so findings could not
      # be fixed before pushing — that is no longer true, and the codebase is
      # clean, so a warning should stop a merge rather than be reported into a
      # summary nobody opens.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --all

  bundle:
    name: Bundle (${{ matrix.os }})
    # Deliberately does NOT depend on the `rust` job. That job runs
    # `clippy -D warnings`, and a single pedantic lint would otherwise block the
    # installers — including the macOS build that testers are waiting on. This
    # job compiles the Rust itself, so genuine compile errors still surface here;
    # only style findings are decoupled.
    needs: [frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
          # Intel, cross-compiled from the Apple Silicon runner.
          #
          # NOT `macos-13`. That was tried first, on the reasoning that a native
          # Intel runner beats cross-compiling — and the job sat queued for
          # SEVENTY-SIX MINUTES with no runner ever assigned and not one step
          # started. That is not capacity; that label has been retired and has
          # nothing behind it. A job that queues forever is worse than one that
          # fails, because nothing ever tells you.
          #
          # So: a runner that certainly exists, building the one extra target.
          # Apple ships both SDKs, so x86_64 from arm64 is a supported
          # cross-compile — and it is a strictly smaller job than the universal
          # build that kept failing, which did both architectures AND a lipo
          # step. If this passes and universal still does not, the lipo step is
          # where the problem always was.
          - os: macos-latest
            label: macos-x64
            target: x86_64-apple-darwin
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # NOTE: unsigned. Signing and notarisation are Phase 4 — see the
      # direction document. Until then macOS users need right-click -> Open and
      # Windows shows a SmartScreen warning.
      # Only the cross-compiled row asks for an extra target; the rest build
      # for the machine they are on and this is a no-op.
      - name: Add the target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Build application
        run: npm run tauri:build ${{ matrix.target != '' && format('-- --target {0}', matrix.target) || '' }}

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: loaf-${{ matrix.label }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
