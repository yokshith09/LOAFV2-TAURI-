name: Release

# Produces PUBLIC, non-expiring download links for macOS and Windows.
#
# CI artefacts are the wrong tool for sharing with testers: they expire after a
# fortnight and can only be downloaded by people with repo access. A Release on
# a public repo gives a plain URL anyone can click.
#
# Nothing publishes until you push a version tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The release is created as a DRAFT so you can look at it before anyone else
# can. Publish it from the Releases page when you are ready.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            # Build a universal binary so one download serves both Apple
            # Silicon and Intel Macs — testers should not have to know which
            # they have. Matches what the Swift reference shipped.
            args: --target universal-apple-darwin
          - os: windows-latest
            label: Windows
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # NOTE: unsigned and un-notarised. macOS testers must right-click -> Open
      # the first time, and Windows shows a SmartScreen warning. Signing is
      # Phase 4 — it needs a paid Apple Developer ID and a Windows cert.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: "Loaf ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseBody: |
            Early test build. A small cat sits on your desktop.

            ---

            ## ⚠️ macOS — DO NOT DOUBLE-CLICK IT

            This app is **not signed by Apple yet**. If you double-click it,
            macOS says *"Loaf cannot be opened because the developer cannot be
            verified"* and only offers you **Cancel**. The app is fine — macOS
            just cannot confirm who built it.

            **Download `Loaf_0.1.0_universal.dmg`** (works on both Apple Silicon
            and Intel), open it, drag **Loaf** into **Applications**, then:

            **On macOS 14 (Sonoma) and earlier**
            1. Open your **Applications** folder
            2. **Right-click** Loaf → **Open**
            3. Click **Open** in the dialog that appears
            4. Only needed the first time

            **On macOS 15 (Sequoia) and later** — right-click → Open was removed
            by Apple, so it must be done from Settings:
            1. Double-click Loaf once. It gets blocked. This is expected.
            2. Open **System Settings** → **Privacy & Security**
            3. Scroll down. There is a line saying *"Loaf was blocked"* with an
               **Open Anyway** button. Click it.
            4. Confirm with Touch ID or your password
            5. Only needed the first time

            **If it still refuses**, run this in Terminal and try again:

            ```
            xattr -dr com.apple.quarantine /Applications/Loaf.app
            ```

            ---

            ## Windows

            Download `Loaf_0.1.0_x64-setup.exe`. SmartScreen will warn because
            the build is unsigned — click **More info** → **Run anyway**.

            ---

            ## Using it

            There is no window and no Dock icon. The cat appears in the
            bottom-right of your screen. **Click** it to cycle through its seven
            expressions, **shift-click** to change which cat.

            ## What is NOT in this build

            This is an early spike to check the app works at all. Time tracking,
            the privacy radar, the focus timer and the character closet are all
            still to come.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
