name: Release

# Produces PUBLIC, non-expiring download links for macOS and Windows.
#
# CI artefacts are the wrong tool for sharing with testers: they expire after a
# fortnight and can only be downloaded by people with repo access. A Release on
# a public repo gives a plain URL anyone can click.
#
# Nothing publishes until you push a version tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The release is created as a DRAFT so you can look at it before anyone else
# can. Publish it from the Releases page when you are ready.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      # ONE AT A TIME, and this is not about runner cost.
      #
      # Both jobs call tauri-action with the same tag and `releaseDraft: true`.
      # GitHub permits several DRAFT releases to share a tag name, so run in
      # parallel neither job sees a release for the tag yet and each creates its
      # own — leaving two drafts, one holding the .dmg and the other the .exe,
      # and whichever you open looks like the build produced nothing. Serialised,
      # the second job finds the first job's draft and uploads into it.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            label: macOS
            # NATIVE ARM64, NOT UNIVERSAL — and this is why.
            #
            # The universal build has failed on every release attempt so far,
            # v0.3.0 and v0.4.0 included, while CI's macOS bundle has passed
            # every time. The only difference between them was this line: CI
            # runs a plain `tauri:build`, the release added
            # `--target universal-apple-darwin`. A release that has never once
            # produced a .dmg is worth less than one that serves Apple Silicon.
            #
            # The cost is honest and stated in the notes: Intel Macs are not
            # covered by this download. Restoring universal means working out
            # why the x86_64 half will not cross-compile on an arm64 runner,
            # which is its own job and not one to do inside a release.
            args: ""
          - os: windows-latest
            label: Windows
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The bare version, for the filenames quoted in the notes below. These
      # were hard-coded once and immediately went stale: the notes for 0.2.0
      # still told people to download Loaf_0.1.0_universal.dmg, a file that
      # does not exist in the release it was attached to.
      - id: ver
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: echo "v=${TAG#v}" >> "$GITHUB_OUTPUT"

      # NOTE: unsigned and un-notarised. macOS testers must right-click -> Open
      # the first time, and Windows shows a SmartScreen warning. Signing is
      # Phase 4 — it needs a paid Apple Developer ID and a Windows cert.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: "Loaf ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseBody: |
            **A small desktop pet that quietly tracks where your time goes.**

            He sits in the corner of your screen. Click him to see your day;
            leave him alone and he gets on with his own life.

            ## Download

            | | |
            |---|---|
            | **macOS** | `Loaf_${{ steps.ver.outputs.v }}_aarch64.dmg` — Apple Silicon. Intel Macs are not covered by this build yet. |
            | **Windows** | `Loaf_${{ steps.ver.outputs.v }}_x64-setup.exe` |

            ## First launch

            This build is not code-signed yet, so both systems will stop you the
            first time you open it. The app is fine — they simply cannot confirm
            who built it. One-time steps:

            <details>
            <summary><b>macOS</b> — please do not just double-click it</summary>

            Double-clicking gives you *"Loaf cannot be opened because the
            developer cannot be verified"* and only a **Cancel** button.

            Open the `.dmg`, drag **Loaf** into **Applications**, then:

            **macOS 14 (Sonoma) and earlier**
            1. Open **Applications**
            2. **Right-click** Loaf → **Open**
            3. Click **Open** in the dialog

            **macOS 15 (Sequoia) and later** — Apple removed right-click → Open, so:
            1. Double-click Loaf once. It gets blocked. This is expected.
            2. **System Settings** → **Privacy & Security**
            3. Scroll down to *"Loaf was blocked"* → **Open Anyway**
            4. Confirm with Touch ID or your password

            Still refusing? In Terminal:

            ```
            xattr -dr com.apple.quarantine /Applications/Loaf.app
            ```

            </details>

            <details>
            <summary><b>Windows</b></summary>

            SmartScreen will warn because the build is unsigned.
            Click **More info** → **Run anyway**.

            </details>

            ## Using him

            There is no window and no Dock or taskbar icon — he just appears in
            the bottom-right of your screen.

            | | |
            |---|---|
            | **Click** | your screen time — **click twice** to close it |
            | **Right-click** | everything else: the closet, the focus timer, the rest |
            | **Drag** | put him anywhere, he stays there |
            | **Hover** a second | today at a glance |

            ## What is in it

            Screen-time tracking with a full history, eighteen characters with
            outfits and pixel art, the closet, the focus timer, speech bubbles,
            ambient behaviour, and the privacy radar — on Windows as well as macOS.

            *Coming later:* your own sounds and hand-drawn characters. Both are
            labelled as such in the app.

            ## Privacy

            No network calls, no account, nothing uploaded — it all stays on your
            machine.

            The privacy radar is **off until you turn it on**. Even then it reads
            only the DOMAIN of your frontmost browser tab (`github.com`) — never
            page content, never a screenshot.

            Starring the repo is an invitation, not a gate: nothing checks whether
            you did, and no feature depends on it.

            ## Known gaps

            - **macOS is unverified.** It compiles and its platform code is
              tested, but this is the first build to reach a Mac. Please say what
              breaks.
            - Unsigned on both platforms, hence the steps above.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
