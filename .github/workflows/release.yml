name: Release

# Produces PUBLIC, non-expiring download links for macOS and Windows.
#
# CI artefacts are the wrong tool for sharing with testers: they expire after a
# fortnight and can only be downloaded by people with repo access. A Release on
# a public repo gives a plain URL anyone can click.
#
# Nothing publishes until you push a version tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The release is created as a DRAFT so you can look at it before anyone else
# can. Publish it from the Releases page when you are ready.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      # ONE AT A TIME, and this is not about runner cost.
      #
      # Both jobs call tauri-action with the same tag and `releaseDraft: true`.
      # GitHub permits several DRAFT releases to share a tag name, so run in
      # parallel neither job sees a release for the tag yet and each creates its
      # own — leaving two drafts, one holding the .dmg and the other the .exe,
      # and whichever you open looks like the build produced nothing. Serialised,
      # the second job finds the first job's draft and uploads into it.
      max-parallel: 1
      matrix:
        include:
          # TWO MAC BUILDS, ONE PER ARCHITECTURE, INSTEAD OF ONE UNIVERSAL.
          #
          # The universal build failed on every release attempt — v0.3.0,
          # v0.4.0, v0.4.1 — while CI's plain `tauri:build` passed every time.
          # The only difference was `--target universal-apple-darwin`. A
          # universal build does BOTH architectures and then lipos them
          # together, so splitting it into two single-target builds removes the
          # step that has no counterpart in the CI job that works.
          #
          # `macos-13` was tried for the Intel half first, to build it natively.
          # That job sat queued for seventy-six minutes with no runner ever
          # assigned — the label is retired and has nothing behind it. So Intel
          # is cross-compiled from the Apple Silicon runner instead, which at
          # least certainly exists.
          #
          # The cost is two downloads rather than one, named in the notes. A
          # file people have to choose between beats a file that was never
          # produced.
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: ""
          - os: macos-latest
            label: macOS (Intel)
            args: --target x86_64-apple-darwin
          - os: windows-latest
            label: Windows
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The Intel row cross-compiles, so that target has to be installed.
          # Only on macOS — Windows builds for the machine it is on.
          targets: ${{ startsWith(matrix.os, 'macos') && 'x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The bare version, for the filenames quoted in the notes below. These
      # were hard-coded once and immediately went stale: the notes for 0.2.0
      # still told people to download Loaf_0.1.0_universal.dmg, a file that
      # does not exist in the release it was attached to.
      - id: ver
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: echo "v=${TAG#v}" >> "$GITHUB_OUTPUT"

      # AD-HOC SIGNED, NOT NOTARISED, AND THE DIFFERENCE IS NOT COSMETIC.
      #
      # Up to 0.4.3 the macOS bundle had no signature at all, because Tauri's
      # bundler skips signing entirely unless an identity is configured and none
      # was. Gatekeeper does not treat that as "unknown developer" — on Apple
      # Silicon a quarantined unsigned bundle is DAMAGED, and the only button is
      # Move to Trash. There is no Open Anyway for it. Testers could not run any
      # release we ever shipped.
      #
      # tauri.conf.json now sets bundle.macOS.signingIdentity to "-", so the
      # bundler runs `codesign --force -s -` over the app. That is a real,
      # verifiable signature by nobody in particular, which is enough for macOS
      # to fall back to the ordinary "unidentified developer" prompt the user
      # can get past. Notarisation still needs a paid Apple Developer ID, and
      # Windows still shows SmartScreen; both are a later phase.
      #
      # The verify step below runs after this one and fails the job if the
      # signature is missing again.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: "Loaf ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseBody: |
            **A small desktop pet that quietly tracks where your time goes.**

            He sits in the corner of your screen. Click him to see your day;
            leave him alone and he gets on with his own life.

            ## Download

            | | |
            |---|---|
            | **macOS — Apple Silicon** | `Loaf_${{ steps.ver.outputs.v }}_aarch64.dmg` — M1 and later |
            | **macOS — Intel** | `Loaf_${{ steps.ver.outputs.v }}_x64.dmg` — pre-2020 Macs |
            | **Windows** | `Loaf_${{ steps.ver.outputs.v }}_x64-setup.exe` |

            ## First launch

            This build is not code-signed yet, so both systems will stop you the
            first time you open it. The app is fine — they simply cannot confirm
            who built it. One-time steps:

            <details>
            <summary><b>macOS</b> — one extra click the first time</summary>

            Open the `.dmg` and drag **Loaf** into **Applications**. Then:

            **macOS 15 (Sequoia) and later**
            1. Double-click Loaf once. It gets blocked. This is expected.
            2. **System Settings** → **Privacy & Security**
            3. Scroll down to *"Loaf was blocked"* → **Open Anyway**
            4. Confirm with Touch ID or your password

            **macOS 14 (Sonoma) and earlier**
            1. **Right-click** Loaf in **Applications** → **Open**
            2. Click **Open** in the dialog

            If anything still refuses, this always works:

            ```
            xattr -dr com.apple.quarantine /Applications/Loaf.app
            ```

            **If you tried 0.4.3 or earlier and were told Loaf was
            "damaged":** that was a real bug in our build, not a bad download.
            The app was going out with no code signature at all, and macOS has
            no Open Anyway path for that — only Move to Trash. It is fixed in
            this build. Delete the old copy and use this one.

            </details>

            <details>
            <summary><b>Windows</b></summary>

            SmartScreen will warn because the build is unsigned.
            Click **More info** → **Run anyway**.

            </details>

            ## Using him

            There is no window and no Dock or taskbar icon — he just appears in
            the bottom-right of your screen.

            | | |
            |---|---|
            | **Click** | your screen time — **click twice** to close it |
            | **Right-click** | everything else: the closet, the focus timer, the rest |
            | **Drag** | put him anywhere, he stays there |
            | **Hover** a second | today at a glance |

            ## What is in it

            Screen-time tracking with a full history, eighteen characters with
            outfits and pixel art, the closet, the focus timer, speech bubbles,
            ambient behaviour, and the privacy radar — on Windows as well as macOS.

            *Coming later:* your own sounds and hand-drawn characters. Both are
            labelled as such in the app.

            ## Privacy

            No network calls, no account, nothing uploaded — it all stays on your
            machine.

            The privacy radar is **off until you turn it on**. Even then it reads
            only the DOMAIN of your frontmost browser tab (`github.com`) — never
            page content, never a screenshot.

            Starring the repo is an invitation, not a gate: nothing checks whether
            you did, and no feature depends on it.

            ## Known gaps

            - **Not notarised.** The macOS build is ad-hoc signed, which is
              what makes it openable at all, but there is no Apple Developer ID
              behind it — so macOS still asks before the first launch. Windows
              shows SmartScreen for the same reason. Both need a paid
              certificate, which is a later phase.
            - **macOS is lightly tested.** It compiles, its platform code is
              tested and CI now checks the bundle is signed and declares what it
              touches. It is still the least-used half. Please say what breaks.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      # Runs AFTER the upload, deliberately: tauri-action builds and publishes in
      # one step and there is no seam between them. That is fine — the same
      # script gates the CI bundle job, so a broken signature stops a commit long
      # before it can be tagged. This copy is the belt-and-braces check on the
      # exact bundle that went into the .dmg people will download, and it turns
      # the job red rather than letting a draft look healthy.
      - name: Verify the macOS bundle
        if: startsWith(matrix.os, 'macos')
        run: bash scripts/verify-macos-bundle.sh
