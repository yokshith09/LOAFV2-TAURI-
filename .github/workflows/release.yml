name: Release

# Produces PUBLIC, non-expiring download links for macOS and Windows.
#
# CI artefacts are the wrong tool for sharing with testers: they expire after a
# fortnight and can only be downloaded by people with repo access. A Release on
# a public repo gives a plain URL anyone can click.
#
# Nothing publishes until you push a version tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The release is created as a DRAFT so you can look at it before anyone else
# can. Publish it from the Releases page when you are ready.
#
# TWO JOBS, NOT A MATRIX, AND THE ORDER IS LOAD-BEARING.
#
# Windows runs first and is the job that CREATES the draft release, because
# tauri-action does that as part of building. macOS then uploads one more file
# into the draft Windows made. Run them the other way round, or in parallel, and
# you get two drafts sharing a tag — GitHub permits that — each holding half the
# files, and whichever you open looks like the build produced nothing. That has
# happened here before.
#
# macOS is not a tauri-action job at all any more. See the build step in it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Windows --
  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # whisper.cpp is compiled from source now; see the same step in ci.yml.
      - name: Point bindgen at libclang (Windows)
        shell: bash
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      # The bare version, for the filenames quoted in the notes below. These
      # were hard-coded once and immediately went stale: the notes for 0.2.0
      # still told people to download Loaf_0.1.0_universal.dmg, a file that
      # does not exist in the release it was attached to.
      - id: ver
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: echo "v=${TAG#v}" >> "$GITHUB_OUTPUT"

      # This step is what CREATES the draft release. The macOS job uploads into
      # the draft it leaves behind.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: "Loaf ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseBody: |
            **A small desktop pet that quietly tracks where your time goes.**

            He sits in the corner of your screen. Click him to see your day;
            leave him alone and he gets on with his own life.

            ## Download

            | | |
            |---|---|
            | **macOS** | `Loaf_${{ steps.ver.outputs.v }}_universal.dmg` — works on Apple Silicon **and** Intel |
            | **Windows** | `Loaf_${{ steps.ver.outputs.v }}_x64-setup.exe` |

            ## First launch

            This build is not notarised yet, so both systems stop you the first
            time you open it. The app is fine — they simply cannot confirm who
            built it. One-time steps:

            <details>
            <summary><b>macOS</b> — one extra click the first time</summary>

            Open the `.dmg` and drag **Loaf** into **Applications**. Then:

            **macOS 15 (Sequoia) and later**
            1. Double-click Loaf once. It gets blocked. This is expected.
            2. **System Settings** → **Privacy & Security**
            3. Scroll down to *"Loaf was blocked"* → **Open Anyway**
            4. Confirm with Touch ID or your password

            **macOS 14 (Sonoma) and earlier**
            1. **Right-click** Loaf in **Applications** → **Open**
            2. Click **Open** in the dialog

            If anything still refuses, this always works:

            ```
            xattr -dr com.apple.quarantine /Applications/Loaf.app
            ```

            **If you tried 0.4.3 or earlier and were told Loaf was
            "damaged":** that was a real bug in our build, not a bad download.
            The app was going out with no code signature at all, and macOS has
            no Open Anyway path for that — only Move to Trash. It is fixed. Drag
            the old copy to the Trash and use this one.

            </details>

            <details>
            <summary><b>Windows</b></summary>

            SmartScreen will warn because the build is unsigned.
            Click **More info** → **Run anyway**.

            </details>

            ## Using him

            There is no window and no Dock or taskbar icon — he just appears in
            the bottom-right of your screen.

            | | |
            |---|---|
            | **Click** | your screen time — **click twice** to close it |
            | **Right-click** | everything else: the closet, the focus timer, the rest |
            | **Drag** | put him anywhere, he stays there |
            | **Hover** a second | today at a glance |

            **Cannot see him at all?** On macOS his menu is in the **menu bar at
            the top right**, not the Dock. Open it and choose **"Can't see him?
            Bring him back"** — that shows the window, puts it back on top, and
            re-parks it in the bottom-right corner.

            ## What is in it

            Screen-time tracking with a full history, eighteen characters with
            outfits and pixel art, the closet, the focus timer, speech bubbles,
            ambient behaviour, the privacy radar, meeting recording with local
            transcription, a notes board, a memory panel, and Connections —
            attaching another program over MCP.

            ## Privacy

            Loaf makes no network calls of its own. No account, nothing
            uploaded, everything in a file on your machine.

            The privacy radar is **off until you turn it on**. Even then it reads
            only the DOMAIN of your frontmost browser tab (`github.com`) — never
            page content, never a screenshot. Meeting recording captures **your
            microphone only** — never system audio — and the audio is deleted the
            moment the transcript exists.

            To be precise about what that does and does not promise: Loaf never
            captures anyone else's audio stream. It cannot stop a microphone from
            hearing a room. **On speakers, the other side of the call comes out of
            them and back into your microphone**, so some of it lands in the
            transcript. Wear headphones if you want "only my voice" to be
            strictly true.

            One honest exception: if you attach a program under **Connections**,
            that program can do anything it likes, including making network calls
            Loaf cannot see. Nothing is attached unless you attach it, nothing
            starts until it is used, and every call is written to a local log you
            can read.

            Starring the repo is an invitation, not a gate: nothing checks whether
            you did, and no feature depends on it.

            ## Known gaps

            - **Not notarised.** macOS is ad-hoc signed, which is what makes it
              openable at all, but there is no Apple Developer ID behind it — so
              macOS still asks before the first launch, and Windows still shows
              SmartScreen. Both need a paid certificate.
            - **No voice on macOS.** The wake word, spoken commands and dictation
              are Windows-only. Meeting recording and transcription work on both.
            - **macOS is lightly tested.** It compiles, its platform code is
              tested, and CI checks the bundle is signed and declares what it
              touches. It is still the least-used half. Please say what breaks.
            - **No auto-update.** You stay on the build you installed.
          releaseDraft: true
          prerelease: true

  # ------------------------------------------------------------------ macOS --
  macos:
    name: Build macOS (universal)
    # Waits for the draft to exist. See the note at the top of this file.
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # WHAT whisper.cpp NEEDS TO COMPILE, on both platforms.
      #
      # whisper-rs builds whisper.cpp from source, which needs cmake, and runs
      # bindgen over its headers, which needs libclang. Both runners have both,
      # but bindgen does not always find libclang on Windows by itself — so the
      # path is given rather than hoped for.
      #
      # NOT the pre-generated bindings the crate also ships. Those were built on
      # Linux: they hard-code the size of glibc's `_IO_FILE` and fail to compile
      # on Windows and macOS with an arithmetic overflow in a size assertion.
      # That was found locally, which is the only reason it was not found in CI.
      - name: Point bindgen at libclang (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - name: Make sure cmake is there
        shell: bash
        run: cmake --version

      # ONE MAC FILE, JOINED BY HAND RATHER THAN BY TAURI.
      #
      # `--target universal-apple-darwin` has failed on every attempt — v0.3.0,
      # v0.4.0, v0.4.1, and a CI row added specifically to diagnose it — while
      # the two plain per-architecture builds pass every single time. Four
      # attempts is enough to stop asking. Both halves build; the only thing ever
      # missing was the step that joins them, and that is one `lipo` call.
      #
      # scripts/make-universal-mac.sh does the merge, re-signs (replacing the
      # executable invalidates the signature, which would be the "damaged" bug
      # all over again), and builds the .dmg.
      - name: Build both Macs and join them
        shell: bash
        run: |
          set -o pipefail
          {
            npm run tauri:build -- --target aarch64-apple-darwin
            npm run tauri:build -- --target x86_64-apple-darwin
            bash scripts/make-universal-mac.sh universal
          } 2>&1 | tee "$RUNNER_TEMP/build.log"

      # SO A FAILURE CAN BE READ WITHOUT A GITHUB LOGIN. Job logs need an
      # authenticated request; annotations do not. For four releases the only
      # thing knowable about a failed macOS build from the development machine
      # was "exit code 1", which is exactly why the universal build got worked
      # around three times instead of fixed once.
      - name: Say what went wrong, somewhere readable
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || { echo "::error title=macOS build failed::no log was captured"; exit 0; }
          MSG=$(tail -60 "$LOG" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=macOS build failed::$MSG"

      # BEFORE the upload this time, not after. The old job used tauri-action,
      # which built and published in one step with no seam between them; this one
      # has a seam, so a bad bundle gets stopped rather than merely reported.
      - name: Verify the macOS bundle
        run: bash scripts/verify-macos-bundle.sh universal/stage/Loaf.app

      # UPLOADING INTO A DRAFT IS THE FIDDLY PART, so it does not rely on one
      # command working. A draft release has no git tag ref of its own as far as
      # the releases API is concerned, and `GET /releases/tags/{tag}` is
      # documented to look up published releases. `gh release upload` is
      # believed to fall back to listing, but "believed to" is how the last four
      # macOS releases went out broken, so there is an explicit fallback that
      # resolves the release id from the list — which definitely does include
      # drafts — and posts the asset straight to the upload endpoint.
      - name: Attach it to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DMG=$(ls universal/*.dmg | head -1)
          ls -lh "$DMG"

          if gh release upload "$TAG" "$DMG" --clobber; then
            echo "Uploaded with gh release upload."
          else
            echo "gh release upload could not see the draft. Resolving it by id."
            ID=$(gh api "repos/$REPO/releases" --paginate                    --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
            if [ -z "$ID" ]; then
              echo "::error title=no release::Nothing exists for tag $TAG. The Windows job should have created it."
              exit 1
            fi
            gh api --method POST               -H "Content-Type: application/octet-stream"               "https://uploads.github.com/repos/$REPO/releases/$ID/assets?name=$(basename "$DMG")"               --input "$DMG"
            echo "Uploaded by release id $ID."
          fi

          echo "The draft now holds:"
          gh api "repos/$REPO/releases" --paginate             --jq ".[] | select(.tag_name==\"$TAG\") | .assets[].name"
