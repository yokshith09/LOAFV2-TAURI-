name: Release

# Produces PUBLIC, non-expiring download links for macOS and Windows.
#
# CI artefacts are the wrong tool for sharing with testers: they expire after a
# fortnight and can only be downloaded by people with repo access. A Release on
# a public repo gives a plain URL anyone can click.
#
# Nothing publishes until you push a version tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The release is created as a DRAFT so you can look at it before anyone else
# can. Publish it from the Releases page when you are ready.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      # ONE AT A TIME, and this is not about runner cost.
      #
      # Both jobs call tauri-action with the same tag and `releaseDraft: true`.
      # GitHub permits several DRAFT releases to share a tag name, so run in
      # parallel neither job sees a release for the tag yet and each creates its
      # own — leaving two drafts, one holding the .dmg and the other the .exe,
      # and whichever you open looks like the build produced nothing. Serialised,
      # the second job finds the first job's draft and uploads into it.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            label: macOS
            # Build a universal binary so one download serves both Apple
            # Silicon and Intel Macs — testers should not have to know which
            # they have. Matches what the Swift reference shipped.
            args: --target universal-apple-darwin
          - os: windows-latest
            label: Windows
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The bare version, for the filenames quoted in the notes below. These
      # were hard-coded once and immediately went stale: the notes for 0.2.0
      # still told people to download Loaf_0.1.0_universal.dmg, a file that
      # does not exist in the release it was attached to.
      - id: ver
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: echo "v=${TAG#v}" >> "$GITHUB_OUTPUT"

      # NOTE: unsigned and un-notarised. macOS testers must right-click -> Open
      # the first time, and Windows shows a SmartScreen warning. Signing is
      # Phase 4 — it needs a paid Apple Developer ID and a Windows cert.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: "Loaf ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseBody: |
            Early test build. A small cat sits on your desktop.

            ---

            ## ⚠️ macOS — DO NOT DOUBLE-CLICK IT

            This app is **not signed by Apple yet**. If you double-click it,
            macOS says *"Loaf cannot be opened because the developer cannot be
            verified"* and only offers you **Cancel**. The app is fine — macOS
            just cannot confirm who built it.

            **Download `Loaf_${{ steps.ver.outputs.v }}_universal.dmg`** (works on both Apple Silicon
            and Intel), open it, drag **Loaf** into **Applications**, then:

            **On macOS 14 (Sonoma) and earlier**
            1. Open your **Applications** folder
            2. **Right-click** Loaf → **Open**
            3. Click **Open** in the dialog that appears
            4. Only needed the first time

            **On macOS 15 (Sequoia) and later** — right-click → Open was removed
            by Apple, so it must be done from Settings:
            1. Double-click Loaf once. It gets blocked. This is expected.
            2. Open **System Settings** → **Privacy & Security**
            3. Scroll down. There is a line saying *"Loaf was blocked"* with an
               **Open Anyway** button. Click it.
            4. Confirm with Touch ID or your password
            5. Only needed the first time

            **If it still refuses**, run this in Terminal and try again:

            ```
            xattr -dr com.apple.quarantine /Applications/Loaf.app
            ```

            ---

            ## Windows

            Download `Loaf_${{ steps.ver.outputs.v }}_x64-setup.exe`. SmartScreen will warn because
            the build is unsigned — click **More info** → **Run anyway**.

            ---

            ## Using it

            There is no window and no Dock icon. The character appears in the
            bottom-right of your screen.

            - **Click** him for your screen time. **Click twice** to close it.
            - **Right-click** him for everything else: the closet, the focus
              timer, and the rest.
            - **Drag** him anywhere. He stays where you drop him.
            - **Hover** for a second to see today at a glance.

            ## What is in this build

            Screen-time tracking with a full history, eighteen characters with
            outfits and pixel art, the closet, the focus timer, speech bubbles,
            ambient behaviour, and the privacy radar — on Windows as well as
            macOS.

            **Coming later:** your own sounds and hand-drawn character packs.
            Both are labelled as such in the app.

            ## Privacy

            Loaf makes no network calls, keeps no account and uploads nothing.
            The privacy radar is off until you switch it on, and it reads only
            the DOMAIN of the frontmost browser tab — never page content, never
            a screenshot. Starring the repo is an invitation: nothing checks
            whether you did, and no feature depends on it.

            ## Known gaps

            - **macOS is unverified.** It compiles and its platform code is
              tested, but this is the first build anyone has run on a Mac.
              Please say what breaks.
            - Unsigned on both platforms, hence the warnings above.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
