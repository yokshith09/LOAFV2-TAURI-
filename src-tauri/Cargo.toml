[package]
name = "loaf"
version = "0.1.0"
description = "Loaf — a private desktop companion"
authors = ["Loaf"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 builds the app as a library so mobile targets can reuse it.
name = "loaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Windows: foreground-window and idle detection come straight from Win32.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
]

[features]
# Nothing custom yet; kept so `--no-default-features` stays meaningful.
default = []

[profile.release]
# A desktop pet sits in memory all day. Optimise for size over raw speed.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
