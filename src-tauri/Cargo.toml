[package]
name = "loaf"
# There are two binaries now (the app and the MCP server), so cargo has to
# be told which one `cargo run` means. Without this, `tauri dev` and the
# release build both stop with "could not determine which binary to run".
default-run = "loaf"
version = "0.5.0"
description = "Loaf — a private desktop companion"
authors = ["Loaf"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 builds the app as a library so mobile targets can reuse it.
name = "loaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api is REQUIRED for a transparent window on macOS. Without it
# `"transparent": true` is silently ignored and the companion arrives sitting on
# an opaque rectangle — which is exactly what the first Mac test build did.
#
# The name is not a warning to ignore: it does use private APIs, so a build with
# this enabled cannot be submitted to the Mac App Store. Direct distribution
# (what we already do, and what the Swift original did) is unaffected.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Recording the user's own microphone for meeting transcription. cpal gives
# the default INPUT device only; system-audio loopback is a different API
# and is deliberately not used. See audio.rs.
cpal = "0.15"
hound = "3"
# THE TRANSCRIBER, COMPILED IN RATHER THAN DOWNLOADED.
#
# Loaf used to download a whisper.cpp release and shell out to whisper-cli.exe.
# That worked on Windows and could never work on a Mac: upstream publishes
# binaries for Windows and Ubuntu and an xcframework, and no macOS command-line
# build at all. So meeting transcription — a headline feature — was quietly
# Windows-only, and so was any hope of a wake word that is not the Windows
# speech API.
#
# whisper-rs compiles whisper.cpp from source as part of the build, so both
# platforms run the same code and there is no binary to fetch, no zip to
# unpack, and no per-platform release to keep in step. Only the model is
# downloaded now.
#
# DEFAULT FEATURES, WHICH MEANS CPU ONLY. Metal on macOS and CUDA on Windows are
# both much faster and both add link-time and runtime requirements that differ
# per machine. The property being bought here is "if CI compiles it, it works on
# both platforms", and a GPU feature is exactly the thing that breaks it.
# Speed is a later, separate decision.
whisper-rs = "0.16"

# Fetching the optional whisper model on request. Blocking
# rather than async: these are Tauri (async) commands already running on the
# thread pool, and a blocking read loop is what makes byte-by-byte progress
# reporting straightforward.
ureq = "2"
# Only the release zip needs unzipping; the model is a plain file download.
zip = { version = "2", default-features = false, features = ["deflate"] }
# THE STORE (M3). Bundled rather than linked against a system SQLite: the
# version that ships with macOS is old, Windows has none at all, and a search
# index whose behaviour depends on which machine it is running on is not a
# search index. Bundled also guarantees FTS5, which the whole of search rests
# on and which system builds do not always include.
#
# It compiles SQLite from C, which is why the build takes longer. That is the
# right trade for the one file that will hold everything the user has said.
rusqlite = { version = "0.32", features = ["bundled"] }

# A native OS notification when a meeting is detected, so the ask-to-record
# prompt is not missed just because nobody happened to be looking at the
# character at that moment.
tauri-plugin-notification = "2"

# Windows: foreground-window and idle detection come straight from Win32.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  # GetTickCount, for the idle-time delta.
  "Win32_System_SystemInformation",
  # The privacy radar reads the address bar through UI Automation.
  "Win32_UI_Accessibility",
  # The scrolling pose listens for Raw Input on a message-only window.
  "Win32_UI_Input",
  "Win32_System_LibraryLoader",
  # WNDCLASSW carries an HBRUSH, so the message-only window needs GDI's types.
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  # Volume is set through the default audio endpoint rather than by
  # simulating the volume keys, so "set volume to forty" can be exact.
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Variant",
  # Speech recognition. WinRT rather than Win32, and the offline recogniser is
  # the one used — see speech.rs.
  "Media_SpeechRecognition",
  "Globalization",
  "Foundation",
  "Foundation_Collections",
  # The offline phrase list is handed to WinRT as an IIterable<HSTRING>, and
  # the only way to build one from a Vec is the stock implementation that lives
  # behind this feature. Without it the list constraint cannot be constructed
  # and the only remaining path is Windows' online dictation grammar.
  "implement",
]

[features]
# Nothing custom yet; kept so `--no-default-features` stays meaningful.
default = []

[profile.release]
# A desktop pet sits in memory all day. Optimise for size over raw speed.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
